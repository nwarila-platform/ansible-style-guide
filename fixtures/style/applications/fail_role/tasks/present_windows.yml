#region ------ [ Process: install the thing ] ------------------------------------------------- #

- name: 'Install The Thing Without A Stage Token'
  block:

    # https://example.invalid/a-single-token-that-no-line-break-can-split-and-that-runs-past-column-97

    - name: 'PROCESS | Remember A Value In A Fact'
      ansible.builtin.set_fact:
        __fail_role_value__: 'x'

    - name: 'PROCESS | Remember A Value Through The Legacy Name'
      ansible.legacy.set_fact:
        __fail_role_legacy__: 'x'

    - name: 'PROCESS | Loop The Old Way'
      with_items: [ 'a', 'b' ]

      ansible.builtin.debug:
        msg: "{{ item }}"

    - name: 'PROCESS | Loop Without A Label'
      loop: [ 'a', 'b' ]

      ansible.builtin.debug:
        msg: "{{ item }}"

    - name: 'PROCESS | Loop With A Null Label'
      loop: [ 'a', 'b' ]
      loop_control:
        label: null

      ansible.builtin.debug:
        msg: "{{ item }}"

    - name: 'PROCESS | Loop With An Empty Label'
      loop: [ 'a', 'b' ]
      loop_control:
        label: ''

      ansible.builtin.debug:
        msg: "{{ item }}"

    - name: 'PROCESS | Loop With A Bare Loop Variable'
      loop: [ 'a', 'b' ]
      loop_control:
        label: "{{ thing }}"
        loop_var: 'thing'

      ansible.builtin.debug:
        msg: "{{ thing }}"

    - name: 'PROCESS | Register Under Another Role Name'
      register: '__other_role_result__'

      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Register Without Single Quotes'
      register: "__fail_role_result__"

      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Register A Mapping Instead Of A Name'
      register:
        result: 'x'

      ansible.builtin.debug:
        msg: 'x'

    - name: "PROCESS | Carry A Double Quoted Name"
      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Carry a Lowercase word'
      ansible.builtin.debug:
        msg: 'x'

    - name: 'VALIDATE | Assert Outside The Contract File'
      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Say Yes To A Legacy Boolean'
      become: yes

      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Run Past The Right Edge With A Name That Is Far Too Long To Fit In One Line'
      ansible.builtin.debug:
        msg: 'x'

    - name: 'PROCESS | Call A Module By Its Short Name'
      debug:
        msg: 'x'

    - become: false
      name: 'PROCESS | Put The Name Second'

      ansible.builtin.debug:
        msg: 'x'

